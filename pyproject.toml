[project]
name = "hplcsim"
version = "0.1.0"
description = "HPLC gradient method simulator: two-run LSS fit and prediction for working chromatographers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
app = ["streamlit>=1.37", "pandas>=2.0", "plotly>=5.20"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "scipy-stubs>=1.18.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hplcsim"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hplcsim"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
